<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sedang offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #1b2420;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        text-align: center;
      }
      main {
        padding: 2rem;
        max-width: 24rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #5b6a62;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        background: #1f6b4f;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
      }
      a:hover {
        background: #154d39;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sedang offline</h1>
      <p>
        Koneksi internet terputus. Halaman yang sudah pernah dibuka masih bisa
        dilihat, atau coba lagi saat jaringan sudah kembali.
      </p>
      <a href="/">Coba lagi</a>

</html>
